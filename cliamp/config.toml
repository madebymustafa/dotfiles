# cliamp configuration
# Theme and visualizer are NOT pinned here — cliamp writes the previous
# session's choices back into this file itself (theme via `T` picker or
# `cliamp theme <name>`, visualizer via `v` / Ctrl+V), so the next launch
# restores exactly what you had on the last session.

# Default provider — Radio. Press S for Spotify, R for Radio, L for Local.
provider = "radio"

# Simplified mode: artist/title + time strip, no visualizer or playlist.
# Uncomment to run the ultra-minimal layout:
# simplified = true

# Spotify — https://developer.spotify.com/dashboard
# client_id read from $CLIAMP_SPOTIFY_ID in ~/.env (kept out of the repo).
eq_preset = "Classical"
eq = [3, 2, 1, 0, -1, -1, 0, 2, 3, 4]
[spotify]
client_id = "${CLIAMP_SPOTIFY_ID}"
bitrate   = 320
