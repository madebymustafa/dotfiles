# AeroSpace tiling window manager configuration
# Docs: https://nikitabobko.github.io/AeroSpace/guide
# Only keys set here override the defaults.

config-version = 2

# Workspaces that stay alive even when empty (v1 inferred these from keybindings)
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "B", "C", "D", "E", "F", "M", "N", "S", "T", "V"]

after-login-command = []
after-startup-command = []

start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Size of accordion padding
accordion-padding = 30

default-root-container-layout = 'tiles'

# 'auto': wide monitor gets horizontal orientation, tall monitor gets vertical
default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

# Keep the mouse exactly where the user leaves it.
# Explicit empties are required here: omitting the keys would fall back to
# the default config, which re-enables monitor-centering on focus changes.
on-focused-monitor-changed = []
on-focus-changed = []

automatically-unhide-macos-hidden-apps = false

# Gaps between windows (inner-*) and between monitor edges (outer-*)
[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     10
outer.top =        10
outer.right =      10

# Pin numbered workspaces to specific monitors
[workspace-to-monitor-force-assignment]
1 = '^Built-in.*$'
2 = '^DELL U.*$'
3 = '^DELL S.*$'

# 'main' binding mode. See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]

# Layouts
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus (vim keys)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Join windows manually
alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# Smart resize
alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'

# Toggle floating <-> tiling (detach window from grid) — classic i3 binding
alt-shift-space = 'layout floating tiling'

# Fullscreen
alt-shift-f = 'fullscreen'

# Switch workspaces: numbers
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Switch workspaces: mnemonics
alt-b = 'workspace B' # Browser (Arc, Zen)
alt-c = 'workspace C' # Code (VS Code, Cursor)
alt-d = 'workspace D' # Design (Figma)
alt-e = 'workspace E' # Email (Spark, Mail)
alt-f = 'workspace F' # Finder
alt-m = 'workspace M' # Music
alt-n = 'workspace N' # Notes (Apple Notes, Notion)
alt-s = 'workspace S' # Slack
alt-t = 'workspace T' # Terminal (WezTerm)
alt-v = 'workspace V' # Video editing

# Move window to workspace
cmd-ctrl-alt-shift-1 = 'move-node-to-workspace 1'
cmd-ctrl-alt-shift-2 = 'move-node-to-workspace 2'
cmd-ctrl-alt-shift-3 = 'move-node-to-workspace 3'
cmd-ctrl-alt-shift-4 = 'move-node-to-workspace 4'
cmd-ctrl-alt-shift-5 = 'move-node-to-workspace 5'
cmd-ctrl-alt-shift-6 = 'move-node-to-workspace 6'
cmd-ctrl-alt-shift-7 = 'move-node-to-workspace 7'
cmd-ctrl-alt-shift-8 = 'move-node-to-workspace 8'
cmd-ctrl-alt-shift-9 = 'move-node-to-workspace 9'
cmd-ctrl-alt-shift-b = 'move-node-to-workspace B'
cmd-ctrl-alt-shift-c = 'move-node-to-workspace C'
cmd-ctrl-alt-shift-d = 'move-node-to-workspace D'
cmd-ctrl-alt-shift-e = 'move-node-to-workspace E'
cmd-ctrl-alt-shift-f = 'move-node-to-workspace F'
cmd-ctrl-alt-shift-m = 'move-node-to-workspace M'
cmd-ctrl-alt-shift-n = 'move-node-to-workspace N'
cmd-ctrl-alt-shift-s = 'move-node-to-workspace S'
cmd-ctrl-alt-shift-t = 'move-node-to-workspace T'
cmd-ctrl-alt-shift-v = 'move-node-to-workspace V'

# Jump back to previous workspace
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Binding modes
alt-shift-semicolon = 'mode service'
alt-shift-enter = 'mode apps'
cmd-ctrl-alt-shift-r = 'mode resize'

# App launcher
cmd-alt-w = 'exec-and-forget open -a /Applications/WezTerm.app'
cmd-alt-z = 'exec-and-forget open -a /Applications/Zen.app'
cmd-alt-s = 'exec-and-forget open -a /Applications/Slack.app'
cmd-alt-m = 'exec-and-forget open -a /System/Applications/Music.app'
cmd-alt-q = 'exec-and-forget open -a "/System/Applications/QuickTime Player.app"'
cmd-alt-f = 'exec-and-forget open -a /System/Library/CoreServices/Finder.app'

# Resize mode: arrow-style resizing with vim keys
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
b = 'balance-sizes'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'

# 'service' binding mode
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # toggle floating
backspace = ['close-all-windows-but-current', 'mode main']

# 'apps' binding mode
[mode.apps.binding]
alt-w = ['exec-and-forget open -a /Applications/WezTerm.app', 'mode main']

# Auto-route apps to workspaces on detection
[[on-window-detected]]
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace B'

[[on-window-detected]]
if.app-id = 'com.figma.Desktop'
run = 'move-node-to-workspace D'

# Code editors
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.todesktop.230313mzl4w4u92'
run = 'move-node-to-workspace C'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'move-node-to-workspace F'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace E'

# Note-taking apps
[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace N'

[[on-window-detected]]
if.app-id = 'notion.id'
run = 'move-node-to-workspace N'

[[on-window-detected]]
if.app-id = 'com.readdle.SparkDesktop'
run = 'move-node-to-workspace E'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'move-node-to-workspace M'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace S'

# Chat and media apps stay floating
[[on-window-detected]]
if.app-name-regex-substring = 'telegram'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'discord'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'trello'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'quicktime'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'safari'
run = 'layout floating'
